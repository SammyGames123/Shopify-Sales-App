query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            title
            # Tag-based filtering: merchants mark products by adding a
            # metafield  namespace="custom"  key="on_sale"  value="true"
            # Leave metafield_key empty in config to discount all products.
            onSale: metafield(namespace: "custom", key: "on_sale") {
              value
            }
          }
        }
      }
    }
  }
  discountNode {
    metafield(namespace: "$app:price-threshold-discount", key: "configuration") {
      value
    }
  }
}

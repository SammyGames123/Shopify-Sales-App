name = "shopify-sales-app"
client_id = "YOUR_CLIENT_ID"
application_url = "https://YOUR_APP_URL.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "YOUR_DEV_STORE.myshopify.com"

[access_scopes]
scopes = "write_discounts,read_discounts,read_products"

[auth]
redirect_urls = [
  "https://YOUR_APP_URL.com/auth/callback",
  "https://YOUR_APP_URL.com/auth/shopify/callback",
  "https://YOUR_APP_URL.com/api/auth/callback"
]

[webhooks]
api_version = "2024-07"

[pos]
embedded = false
